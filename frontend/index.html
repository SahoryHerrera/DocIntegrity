<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Huella</title>
    <meta name="description" content="Herramienta web para registrar y verificar la integridad de documentos digitales con SHA-256, blockchain e inteligencia artificial." />

    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      try { var t = localStorage.getItem('huella.tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
